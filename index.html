<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProTendr</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>ProTendr</h1>
    <p class="subtitle">Open EU/Greek tenders, filtered to CPV codes worth my time.</p>
    <p id="meta" class="meta"></p>
  </header>

  <section class="controls">
    <input id="search" type="search" placeholder="Search title or buyer…" />

    <select id="sort">
      <option value="deadline-asc">Deadline: soonest first</option>
      <option value="deadline-desc">Deadline: latest first</option>
      <option value="published-desc">Published: newest first</option>
      <option value="published-asc">Published: oldest first</option>
      <option value="value-desc">Value: highest first</option>
      <option value="value-asc">Value: lowest first</option>
    </select>

    <select id="source">
      <option value="">All sources</option>
      <option value="TED">TED only</option>
      <option value="KIMDIS">KIMDIS only</option>
    </select>

    <select id="cpv">
      <option value="">All CPV codes</option>
    </select>

    <div class="value-range">
      <input id="minValue" type="number" inputmode="numeric" placeholder="Min €" min="0" />
      <span>–</span>
      <input id="maxValue" type="number" inputmode="numeric" placeholder="Max €" min="0" />
    </div>

    <label class="hide-seen">
      <input id="hideSeen" type="checkbox" />
      Hide already-seen
    </label>

    <button id="resetFilters" type="button" class="reset">Reset filters</button>
  </section>

  <main>
    <table id="tenders">
      <thead>
        <tr>
          <th style="width: 3rem"></th>
          <th style="width: 30%">Title</th>
          <th style="width: 20%">Buyer</th>
          <th style="width: 15%">CPV</th>
          <th style="width: 10%">Value</th>
          <th style="width: 12%">Deadline</th>
          <th>Published</th>
        </tr>
      </thead>
      <tbody id="tenders-body"></tbody>
    </table>
    <p id="empty" class="empty" hidden>No open notices match right now.</p>
  </main>

  <footer>
    <p>Sources: <a href="https://docs.ted.europa.eu/api/latest/" target="_blank" rel="noopener">TED Search API</a>
       and <a href="https://cerpp.eprocurement.gov.gr/khmdhs-opendata/swagger-ui/index.html" target="_blank" rel="noopener">KIMDIS Open Data API</a>.
       Watch list is <a href="config/watch.json" target="_blank" rel="noopener">config/watch.json</a>.
       Data refreshed on a schedule by GitHub Actions &mdash; see <a href="https://github.com/thanasisth/protendr" target="_blank" rel="noopener">source</a>.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
