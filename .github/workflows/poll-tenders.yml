name: Poll tenders

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-tenders
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch tenders
        run: node scripts/fetch-tenders.mjs

      - name: Commit data if changed
        run: |
          git config user.name "tenderlookup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tenders.json
          if git diff --cached --quiet; then
            echo "No changes in data/tenders.json"
          else
            git commit -m "Update tenders data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
